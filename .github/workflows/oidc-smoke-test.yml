name: AWS OIDC smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - Update
    paths:
      - ".github/workflows/oidc-smoke-test.yml"

permissions:
  id-token: write
  contents: read

jobs:
  assume-role:
    name: Assume plan role
    runs-on: ubuntu-latest
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: livecap-github-oidc-smoke-test
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "720459752315"

      - name: Verify assumed identity
        run: |
          aws sts get-caller-identity \
            --query '{Account:Account,Arn:Arn}' \
            --output json
