name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      architecture:
        description: "Image/Fargate architecture"
        type: choice
        default: amd64
        options: [amd64]

permissions:
  contents: read
  id-token: write

concurrency:
  group: livecap-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ARCHITECTURE: ${{ inputs.architecture || 'amd64' }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m compileall app
          pytest

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Validate Terraform
        run: |
          terraform fmt -check -recursive
          terraform -chdir=infrastructure/terraform init -backend=false
          terraform -chdir=infrastructure/terraform validate

  build-backend:
    name: Build and push backend image
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute immutable image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA::7}-${ARCHITECTURE}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "720459752315"

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/${{ env.ARCHITECTURE }}
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}

  deploy-backend:
    name: Deploy ECS task definitions
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "720459752315"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Write deployment inputs
        working-directory: infrastructure/terraform
        env:
          TF_BACKEND_HCL: ${{ secrets.TF_BACKEND_HCL }}
          TF_VARS: ${{ secrets.TF_VARS }}
        run: |
          printf '%s' "$TF_BACKEND_HCL" > backend.hcl
          printf '%s' "$TF_VARS" > ci.auto.tfvars

      # Restrict automatic Terraform to application delivery. General
      # infrastructure changes remain explicit, reviewed Terraform applies.
      - name: Apply ECS delivery plan
        working-directory: infrastructure/terraform
        run: |
          terraform init -input=false -backend-config=backend.hcl
          terraform plan -input=false -no-color -out=tfplan \
            -target='aws_ecs_task_definition.target_backend' \
            -target='aws_ecs_service.target_backend' \
            -var "backend_image_tag=${{ needs.build-backend.outputs.image_tag }}" \
            -var 'task_cpu_architecture=X86_64'
          terraform apply -input=false -no-color tfplan

      - name: Wait for stable services
        run: |
          aws ecs wait services-stable \
            --cluster livecap-cluster-dev \
            --services livecap-target-service-dev

  deploy-frontend:
    name: Deploy frontend and invalidate CloudFront
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "720459752315"

      - name: Build frontend
        working-directory: frontend
        env:
          FRONTEND_ENV_PRODUCTION: ${{ secrets.FRONTEND_ENV_PRODUCTION }}
        run: |
          printf '%s' "$FRONTEND_ENV_PRODUCTION" > .env.production
          npm ci
          npm run build

      # Hashed assets stay available for existing browser sessions. HTML and
      # fixed-name files revalidate immediately to avoid stale bundle 403s.
      - name: Upload frontend
        working-directory: frontend
        run: |
          aws s3 cp dist/assets/ "s3://${{ vars.FRONTEND_BUCKET }}/assets/" \
            --recursive --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/ "s3://${{ vars.FRONTEND_BUCKET }}/" \
            --recursive --exclude "assets/*" --exclude "*.html" \
            --cache-control "no-cache,must-revalidate"
          aws s3 cp dist/ "s3://${{ vars.FRONTEND_BUCKET }}/" \
            --recursive --exclude "*" --include "*.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$invalidation_id"

  deploy-preview-backend:
    name: Deploy preview room backend
    runs-on: ubuntu-latest
    needs: [build-backend, deploy-backend]
    outputs:
      frontend_bucket: ${{ steps.preview.outputs.frontend_bucket }}
      distribution_id: ${{ steps.preview.outputs.distribution_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "720459752315"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Write deployment inputs
        working-directory: infrastructure/terraform
        env:
          TF_BACKEND_HCL: ${{ secrets.TF_BACKEND_HCL }}
          TF_VARS: ${{ secrets.TF_VARS }}
        run: |
          printf '%s' "$TF_BACKEND_HCL" > backend.hcl
          printf '%s' "$TF_VARS" > ci.auto.tfvars

      - name: Apply preview ECS delivery plan
        working-directory: infrastructure/terraform
        env:
          IMAGE_TAG: ${{ needs.build-backend.outputs.image_tag }}
        run: |
          terraform init -input=false -backend-config=backend.hcl
          terraform plan -input=false -no-color -out=tfplan \
            -target='aws_ecs_task_definition.preview_backend[0]' \
            -target='aws_ecs_service.preview_backend[0]' \
            -var "preview_backend_image_tag=$IMAGE_TAG" \
            -var 'preview_enable_shared_rooms=true' \
            -var 'preview_enable_room_screen_share=true' \
            -var 'task_cpu_architecture=X86_64'
          terraform apply -input=false -no-color tfplan

      - name: Read preview frontend destination
        id: preview
        working-directory: infrastructure/terraform
        run: |
          printf 'frontend_bucket=%s\n' "$(terraform output -raw preview_frontend_bucket_name)" >> "$GITHUB_OUTPUT"
          printf 'distribution_id=%s\n' "$(terraform output -raw preview_cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Wait for preview backend
        run: |
          aws ecs wait services-stable \
            --cluster livecap-cluster-dev \
            --services livecap-preview-service-dev

  deploy-preview-frontend:
    name: Deploy preview frontend
    runs-on: ubuntu-latest
    needs: deploy-preview-backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "720459752315"

      - name: Build preview frontend
        working-directory: frontend
        env:
          FRONTEND_ENV_PRODUCTION: ${{ secrets.FRONTEND_ENV_PRODUCTION }}
          VITE_API_BASE_URL: ""
          VITE_WS_URL: ""
          VITE_ROOMS_WS_URL: ""
          VITE_BACKEND_HEALTH_URL: ""
          VITE_WAKE_BACKEND_URL: "/api/wake"
          VITE_ENABLE_SHARED_ROOMS: "true"
          VITE_ENABLE_ROOM_SCREEN_SHARE: "true"
        run: |
          printf '%s' "$FRONTEND_ENV_PRODUCTION" > .env.production
          npm ci
          npm run build

      - name: Upload preview frontend
        working-directory: frontend
        env:
          FRONTEND_BUCKET: ${{ needs.deploy-preview-backend.outputs.frontend_bucket }}
        run: |
          aws s3 cp dist/assets/ "s3://$FRONTEND_BUCKET/assets/" \
            --recursive --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/ "s3://$FRONTEND_BUCKET/" \
            --recursive --exclude "assets/*" --exclude "*.html" \
            --cache-control "no-cache,must-revalidate"
          aws s3 cp dist/ "s3://$FRONTEND_BUCKET/" \
            --recursive --exclude "*" --include "*.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate preview CloudFront
        env:
          DISTRIBUTION_ID: ${{ needs.deploy-preview-backend.outputs.distribution_id }}
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$invalidation_id"
