# =============================================================================
# LiveCap — Nginx reverse proxy configuration
# =============================================================================
#
# This file belongs at /etc/nginx/conf.d/livecap.conf on the EC2 instance.
#
# Before applying:
#   1. Replace every occurrence of YOUR_DOMAIN with your actual domain name
#      (e.g. livecap.example.com).
#   2. Obtain a TLS certificate for that domain, e.g. with Certbot:
#          sudo certbot certonly --nginx -d YOUR_DOMAIN
#      Certbot will write the certificate files to the paths referenced below.
#   3. Test the config:   sudo nginx -t
#   4. Reload:            sudo systemctl reload nginx
#
# The WebSocket endpoint will then be reachable at:
#   wss://YOUR_DOMAIN/ws/transcribe
#
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect (port 80)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name YOUR_DOMAIN;

    # Redirect all plain-HTTP requests to HTTPS.
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# Main HTTPS / WSS server (port 443)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name YOUR_DOMAIN;

    # ------------------------------------------------------------------
    # TLS configuration
    # ------------------------------------------------------------------
    # Replace YOUR_DOMAIN below with your actual domain name.
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Only allow TLS 1.2 and TLS 1.3 (satisfies the TLS 1.2+ requirement).
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strong cipher selection for TLS 1.2; TLS 1.3 ciphers are built-in.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Session resumption — reduces handshake overhead for reconnecting clients.
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — instruct browsers to use HTTPS for one year (optional but recommended).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ------------------------------------------------------------------
    # Gzip compression for text responses
    # ------------------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # ------------------------------------------------------------------
    # Upstream: Uvicorn / FastAPI on localhost
    # ------------------------------------------------------------------
    # All proxy locations share these common headers.
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # ------------------------------------------------------------------
    # WebSocket endpoint: /ws/transcribe
    #
    # The WebSocket upgrade handshake requires the "Upgrade" and
    # "Connection" headers to be forwarded explicitly.  The long
    # proxy_read_timeout keeps the connection alive for the entire
    # duration of a live captioning session (up to 1 hour).
    # ------------------------------------------------------------------
    location /ws/transcribe {
        proxy_pass http://127.0.0.1:8000;

        # WebSocket upgrade headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Keep the connection open for long-lived WebSocket sessions
        # (up to 1 hour; adjust to match SESSION_TIMEOUT in .env).
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;

        # Disable buffering — essential for real-time streaming.
        proxy_buffering off;
    }

    # ------------------------------------------------------------------
    # REST / health-check endpoints: /api/*
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        # Standard timeouts for short-lived REST calls.
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # ------------------------------------------------------------------
    # Catch-all: forward everything else to Uvicorn as well.
    # (Uncomment / extend if FastAPI serves additional paths.)
    # ------------------------------------------------------------------
    # location / {
    #     proxy_pass http://127.0.0.1:8000;
    #
    #     proxy_read_timeout    60s;
    #     proxy_send_timeout    60s;
    #     proxy_connect_timeout 10s;
    # }
}
